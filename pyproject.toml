[project]
name = "crawl-backend"
version = "0.1.0"
requires-python = ">=3.10"
# Phiên bản cụ thể: lấy từ requirements.txt của repo (nguồn sự thật).
dependencies = ["requests", "beautifulsoup4", "lxml", "certifi"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
